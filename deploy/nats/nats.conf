# NATS for Mastermind (bead mm-210.15). Image: nats:2.15.2.
#
# Every value that is a secret comes from the container environment:
#   NATS_AUTH_PASSWORD   password of the "mastermind" user in account AUTH
#   NATS_ISSUER_PUBLIC   public nkey (A...) of the account key that signs
#                        auth callout responses. Mastermind holds the seed
#                        as NATS_ISSUER_SEED; the server needs only the public key.
#
# Until Mastermind runs the auth callout service, the server refuses every
# client connection except the "mastermind" auth user. That is the safe state.

server_name: mastermind-nats

# Client port: internal Docker network only (the mastermind app uses
# nats://nats:4222). Do not publish it on the host.
port: 4222

# Monitoring: internal only. Do not publish it on the host or route it.
http: 8222

jetstream {
	# Mount a persistent volume here.
	store_dir: "/data/jetstream"
	# Explicit limits (mm-210.36). The api's health warns above 80 percent of APP's max_file.
	max_file_store: 20G
	max_memory_store: 512M
	# fsync every write. The default (every 2 min) can lose the last 2 min of writes on an OS
	# crash or power loss. Mastermind writes little, so the cost is small.
	sync_interval: always
}

# WebSocket for adapters. TLS ends at Cloudflare/Traefik, so no TLS here.
# The reverse proxy routes the public wss URL (NATS_PUBLIC_WS_URL) to this port.
websocket {
	port: 8080
	no_tls: true
}

accounts {
	# Only the Mastermind auth callout service logs in here.
	AUTH: {
		users: [ { user: mastermind, password: $NATS_AUTH_PASSWORD } ]
	}
	# Every user that the auth callout admits lands here.
	# All of Mastermind's state is in APP: work items (stream MM_WORK, max_bytes set by the
	# api, discard new), accounts, routing and environments (KV buckets).
	APP: { jetstream: { max_file: 10G, max_mem: 256M } }
	SYS: {}
}
system_account: SYS

authorization {
	auth_callout {
		issuer: $NATS_ISSUER_PUBLIC
		auth_users: [ mastermind ]
		account: AUTH
	}
}

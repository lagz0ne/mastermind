# The Mastermind infra stack. Dokploy runs this file from git (compose service
# `mastermind-infra`, project `mastermind`); `bun deploy/dokploy.ts apply` creates it.
#
# Secrets come from the compose environment in Dokploy. They are never in this repo.
# Nothing publishes a host port: the app reaches the service over `dokploy-network` by alias.
# NATS is not here: it needs a public route, and on this Dokploy only applications get one
# (see deploy/nats and deploy/dokploy.ts).
services:
  # The work queue: beads in Dolt. The app reads it with Bun.SQL and writes through bd serve.
  dolt:
    image: docker.io/dolthub/dolt-sql-server:2.7.2
    restart: unless-stopped
    environment:
      DOLT_ROOT_PASSWORD: ${DOLT_ROOT_PASSWORD:?set by deploy/dokploy.ts}
      DOLT_ROOT_HOST: "%"
    volumes:
      - dolt-data:/var/lib/dolt
      - dolt-backups:/backups
    networks:
      dokploy-network:
        aliases: [mastermind-dolt]

networks:
  dokploy-network:
    external: true

volumes:
  dolt-data:
  dolt-backups:

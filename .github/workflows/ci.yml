# Trunk-based CI/CD: every push to main is verified, then shipped.
name: ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, never cancelled mid-deploy. While one runs, GitHub keeps only the
# newest waiting run, so trunk always converges on the latest commit without starving.
concurrency:
  group: ci-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check

  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Dokploy runs the site. Its hooks and PUBLIC_URL are in the GitHub environment
  # (`bun deploy/dokploy.ts secrets` puts them there). The job is green only when
  # the public site serves this commit and every dependency is up.
  # With the secret DOKPLOY_API_KEY in that environment, the app deploy is
  # `bun deploy/dokploy.ts release <sha>`: it pins the image of THIS commit, shows the
  # Dokploy queue and status, and fails with the Dokploy log tail. Without it, the app
  # hook deploys :latest and the job can only watch /api/health.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_DEPLOY_HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Redeploy what changed since the live commit
        env:
          DOKPLOY_INFRA_HOOK: ${{ secrets.DOKPLOY_INFRA_HOOK }}
          DOKPLOY_NATS_HOOK: ${{ secrets.DOKPLOY_NATS_HOOK }}
        run: |
          live=$(curl -fsS --max-time 10 "$PUBLIC_URL/api/health" | jq -r '.version' || true)
          echo "live: ${live:-unknown}"
          # True when the paths differ from the live commit, or when that commit is unknown.
          changed() {
            git cat-file -e "$live^{commit}" 2>/dev/null || return 0
            ! git diff --quiet "$live" "$GITHUB_SHA" -- "$@"
          }
          # Dokploy checks the branch of a git source, so send it like a push event.
          git_hook() {
            curl -fsS --retry 3 -o /dev/null -X POST -H 'content-type: application/json' \
              -H 'x-github-event: push' -d "{\"ref\":\"$GITHUB_REF\"}" "$1"
          }
          if changed deploy/compose.yml; then echo "infra changed"; git_hook "$DOKPLOY_INFRA_HOOK"; fi
          if changed deploy/nats; then echo "nats changed"; git_hook "$DOKPLOY_NATS_HOOK"; fi
          if [ -n "$DOKPLOY_API_KEY" ]; then
            bun deploy/dokploy.ts release "$GITHUB_SHA"
          else
            echo "no DOKPLOY_API_KEY: app hook (:latest); Dokploy status is not visible from here"
            curl -fsS --retry 3 -o /dev/null -X POST "$DOKPLOY_DEPLOY_HOOK"
          fi
      - name: Wait until production serves this commit
        run: |
          # Dokploy runs one deployment at a time for ALL its projects, so ours may queue
          # behind other builds. Do not post the hook again: every post adds a job to that queue.
          for i in $(seq 180); do
            health=$(curl -sS --max-time 10 "$PUBLIC_URL/api/health" || true)
            version=$(jq -r '.version // empty' <<<"$health" 2>/dev/null || true)
            if [ "$version" = "$GITHUB_SHA" ] && [ "$(jq -r '.ok' <<<"$health")" = "true" ]; then
              echo "live: $health"
              exit 0
            fi
            echo "waiting ($i): ${health:-no answer}"
            sleep 5
          done
          echo "::error::production does not serve $GITHUB_SHA with ok=true after 15 minutes. Dokploy runs one deployment at a time for all projects; check its queue. Without DOKPLOY_API_KEY in the environment this job cannot show the Dokploy status or log."
          exit 1
      - name: The public NATS WebSocket answers and refuses unauthenticated clients
        run: |
          url="$(sed 's/^http/ws/' <<<"$PUBLIC_URL")/nats"
          for i in $(seq 12); do
            if bun deploy/nats/smoke.ts "$url"; then exit 0; fi
            sleep 10
          done
          exit 1

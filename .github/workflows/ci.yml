# Trunk-based CI/CD: every push to main is verified, then shipped.
name: ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, never cancelled mid-deploy. While one runs, GitHub keeps only the
# newest waiting run, so trunk always converges on the latest commit without starving.
concurrency:
  group: ci-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check

  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Dokploy (managed by the ~/work hub) pulls :latest and restarts the app.
  # The job is green only once the public site reports this commit.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://mastermind.vibea.dev
    steps:
      - name: Trigger Dokploy
        env:
          DOKPLOY_DEPLOY_HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: curl -fsS --retry 3 -o /dev/null -X POST "$DOKPLOY_DEPLOY_HOOK"
      - name: Wait until production serves this commit
        run: |
          for i in $(seq 60); do
            version=$(curl -fsS --max-time 10 https://mastermind.vibea.dev/api/health | jq -r '.version' || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "live: $version"
              exit 0
            fi
            echo "waiting ($i): serving ${version:-nothing}"
            sleep 5
          done
          echo "::error::production is not serving $GITHUB_SHA after 5 minutes"
          exit 1
